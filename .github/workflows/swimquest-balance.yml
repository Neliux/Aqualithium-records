name: Swim Quest balance patch
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch balance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('base*(purchases.ketchup?1.10:1)*.70','base*(purchases.ketchup?1.10:1)*.85')
          s=s.replace('base*(S.purchases.ketchup?1.10:1)*.70*(S.consumables?.cloroPremium>0?1.20:1)','base*(S.purchases.ketchup?1.10:1)*.85*(S.consumables?.cloroPremium>0?1.20:1)')
          s=s.replace('trainingXP(e)*.11*trainingCoinMultiplier()','trainingXP(e)*.132*trainingCoinMultiplier()')
          s=s.replace('draftXP()*.11*trainingCoinMultiplier()','draftXP()*.132*trainingCoinMultiplier()')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Balance: +20% monedas y -15% XP por entrenamiento' || exit 0
          git push
