name: Apply Swim Quest social and theme fixes
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip swim-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- SWIM QUEST SOCIAL/PASSWORD/80S PATCH v1 -->'
          if marker in s:
              print('Patch already present')
              raise SystemExit(0)
          s=s.replace('return Math.round(base*(purchases.ketchup?1.10:1)*.70)', 'return Math.round(base*(purchases.ketchup?1.10:1)*.85)')
          s=s.replace('Math.round(trainingXP(e)*.11*trainingCoinMultiplier())', 'Math.round(trainingXP(e)*.132*trainingCoinMultiplier())')
          css='''\n/* SWIM QUEST — ESTILO 80s / TV CRT */\nbody.theme-retro80s{--bg:#111;--bg2:#1b1b1b;--panel:#161616;--panel2:#222;--line:#666;--text:#f3f3f3;--muted:#b9b9b9;--a:#fff;--b:#777;filter:grayscale(1) contrast(1.08);background:radial-gradient(circle at 50% 45%,#2b2b2b 0,#111 55%,#050505 100%)!important}\nbody.theme-retro80s::before{background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px),radial-gradient(circle at 50% 50%,rgba(255,255,255,.08),transparent 60%);animation:retroNoise .18s steps(2) infinite;opacity:.75}\nbody.theme-retro80s::after{content:"";position:fixed;inset:0;z-index:40;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(255,255,255,.035) 3px,transparent 4px);mix-blend-mode:screen;opacity:.42}\nbody.theme-retro80s .logo,body.theme-retro80s .primary{background:linear-gradient(180deg,#fff,#777)!important;color:#080808!important}\nbody.theme-retro80s .card,body.theme-retro80s .hero,body.theme-retro80s .nav{border-color:#707070;box-shadow:0 0 0 1px rgba(255,255,255,.04),0 12px 35px rgba(0,0,0,.45)}\nbody.theme-retro80s .btn,body.theme-retro80s .pill{border-radius:4px}\nbody.theme-retro80s .card,body.theme-retro80s .hero{border-radius:7px}\nbody.theme-retro80s.retro-glitch .app{animation:retroGlitch .16s steps(2) 2}\nbody.theme-retro80s.retro-glitch .logo,body.theme-retro80s.retro-glitch .big,body.theme-retro80s.retro-glitch h1,body.theme-retro80s.retro-glitch h2{transform:skewX(-2deg);text-shadow:2px 0 #fff,-2px 0 #777}\n@keyframes retroNoise{0%{transform:translate(0,0)}25%{transform:translate(-1px,1px)}50%{transform:translate(1px,-1px)}75%{transform:translate(0,1px)}100%{transform:translate(-1px,0)}}\n@keyframes retroGlitch{0%{transform:translate(0)}30%{transform:translate(-4px,1px)}55%{transform:translate(4px,-1px)}100%{transform:translate(0)}}\n'''
          s=s.replace('</style>',css+'\n</style>',1)
          s=s.replace('PerroCaliente:{a:"#ff4a3d",b:"#ffc928",emoji:"🌭",desc:"Rojo y amarillo con salchichas cayendo desde el cielo."}', 'PerroCaliente:{a:"#ff4a3d",b:"#ffc928",emoji:"🌭",desc:"Rojo y amarillo con salchichas cayendo desde el cielo."}, Retro80s:{a:"#ffffff",b:"#555555",emoji:"📺",desc:"Televisión de los 80: blanco, gris y negro, con interferencias CRT ocasionales."}')
          s=s.replace('document.body.classList.toggle("leva",S.settings.theme==="Leviatan");', 'document.body.classList.toggle("leva",S.settings.theme==="Leviatan"); document.body.classList.toggle("retro-glitch",false); if(S.settings.theme==="Retro80s")setTimeout(()=>{if(S.settings.theme==="Retro80s"){document.body.classList.add("retro-glitch");setTimeout(()=>document.body.classList.remove("retro-glitch"),420)}},900+Math.random()*3200);')
          if 'id:"theme_Retro80s"' not in s:
              anchor='{id:"music3",icon:"🕹️",name:"Tema musical: Salto Pixel",price:290,desc:"Música chiptune original.",buy:()=>S.purchases.music3=true},'
              s=s.replace(anchor,anchor+'\n {id:"theme_Retro80s",icon:"📺",name:"Estilo 80s",price:320,desc:"Televisión clásica en blanco, gris y negro con interferencia CRT ocasional.",buy:()=>S.purchases.theme_Retro80s=true},')
          s=s.replace('if(unlocked.length)save();\n return unlocked;', 'if(unlocked.length){save();if(authUser&&supabaseClient)syncProfileToCloud();}\n return unlocked;')
          s=s.replace('save();return a;\n}\nfunction unlockHotdog', 'save();if(authUser&&supabaseClient)syncProfileToCloud();return a;\n}\nfunction unlockHotdog')
          password_fn='''\nasync function changePasswordModal(){modal(`<div class="kicker">🔐 SEGURIDAD</div><h2>Cambiar contraseña</h2><p class="sub">La contraseña la gestiona Supabase Auth; Swim Quest nunca la guarda en tu perfil.</p><div class="field"><label>Nueva contraseña</label><input id="newPassword" type="password" minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres"></div><div class="field"><label>Repetir contraseña</label><input id="newPassword2" type="password" minlength="6" autocomplete="new-password" placeholder="Repite la contraseña"></div><button class="btn primary" onclick="saveNewPassword()">Guardar contraseña</button><button class="btn secondary" style="margin-top:8px" onclick="closeModal()">Cancelar</button>`)}\nasync function saveNewPassword(){const a=$("newPassword")?.value||"",b=$("newPassword2")?.value||"";if(a.length<6){toast("La contraseña debe tener al menos 6 caracteres.");return}if(a!==b){toast("Las contraseñas no coinciden.");return}const {error}=await supabaseClient.auth.updateUser({password:a});if(error){toast("❌ "+(error.message||"No se pudo cambiar la contraseña."));return}closeModal();toast("🔐 Contraseña actualizada correctamente.",4000)}\n'''
          s=s.replace('async function resetPasswordRequest(){',password_fn+'\nasync function resetPasswordRequest(){',1)
          s=s.replace('supabaseClient.auth.onAuthStateChange((_event,session)=>{authUser=session?.user||null;if(authUser)setTimeout(()=>syncCurrentAccount(),0);render()})','supabaseClient.auth.onAuthStateChange((_event,session)=>{authUser=session?.user||null;if(authUser)setTimeout(()=>syncCurrentAccount(),0);if(_event==="PASSWORD_RECOVERY")setTimeout(()=>changePasswordModal(),250);render()})')
          s=s.replace('window.authModal=authModal;','window.changePasswordModal=changePasswordModal;window.saveNewPassword=saveNewPassword;window.authModal=authModal;',1)
          start=s.find('async function socialModal(tab="friends"){'); end=s.find('async function sendFriendRequest()',start)
          if start!=-1 and end!=-1:
              new='''async function socialModal(tab="friends"){\n let friends=[],requests=[],myClan=null,joinRequests=[];\n try{const f=await supabaseClient.from("friendships").select("user_id,friend_id").or(`user_id.eq.${authUser.id},friend_id.eq.${authUser.id}`);friends=f.data||[];const rq=await supabaseClient.from("friend_requests").select("id,sender_id,receiver_id,created_at").or(`sender_id.eq.${authUser.id},receiver_id.eq.${authUser.id}`).order("created_at",{ascending:false});requests=rq.data||[];const mc=await supabaseClient.rpc("get_my_clan");if(!mc.error&&mc.data?.clan)myClan={...mc.data.clan,members:mc.data.members||[]};if(myClan?.owner_id===authUser.id){const jr=await supabaseClient.from("clan_join_requests").select("id,user_id,created_at").eq("clan_id",myClan.id).order("created_at",{ascending:true});joinRequests=jr.data||[];}}catch(e){console.warn("social",e)}\n if(tab==="clan"){if(myClan){const ids=myClan.members.map(m=>m.user_id);let prof=[];if(ids.length){const r=await supabaseClient.from("profiles").select("id,username,public_player_id,level,rank,meters,xp").in("id",ids);prof=r.data||[];}const pmap=Object.fromEntries(prof.map(p=>[p.id,p]));const members=myClan.members.map(m=>({...m,profile:pmap[m.user_id]}));modal(`<div class="kicker">🏷️ CLAN</div><h2>${esc(myClan.name)}</h2><div class="pill">${myClan.owner_id===authUser.id?"👑 Eres el propietario":"👥 Miembro"}</div><p class="sub" style="margin-top:8px">El propietario puede aceptar solicitudes y expulsar miembros.</p><div class="list" style="margin-top:10px">${members.map(m=>{const p=m.profile||{};return `<div class="list-item"><div class="row"><div><b>${m.user_id===authUser.id?"👑 Tú":`👤 ${esc(p.username||m.user_id.slice(0,8))}`}</b><div class="sub">${esc(p.public_player_id||"")} · ${esc(p.rank||"Bronce")} · LV ${fmt(p.level||1)} · ${fmt(p.meters||0)} m</div></div><span class="pill">${m.role==="owner"?"Propietario":"Miembro"}</span></div>${myClan.owner_id===authUser.id&&m.user_id!==authUser.id?`<button class="btn danger" style="margin-top:7px" onclick="removeClanMember('${myClan.id}','${m.user_id}')">Expulsar</button>`:""}</div>`}).join("")}</div>${myClan.owner_id===authUser.id?`<h3 style="margin-top:12px">📩 Solicitudes de entrada</h3>${joinRequests.length?joinRequests.map(r=>`<div class="list-item row"><span>👤 ${esc(r.user_id.slice(0,8))}</span><button class="btn primary" style="width:auto" onclick="approveClanRequest('${r.id}','${r.user_id}','${myClan.id}')">Aceptar</button></div>`).join(""):`<div class="sub">No hay solicitudes pendientes.</div>`}`:""}<button class="btn secondary" style="margin-top:10px" onclick="leaveClan('${myClan.id}')">${myClan.owner_id===authUser.id?"Eliminar clan":"Salir del clan"}</button><button class="btn secondary" style="margin-top:8px" onclick="closeModal()">Cerrar</button>`);}else{modal(`<div class="kicker">🏷️ CLAN</div><h2>Crear o unirte</h2><p class="sub">Crea tu clan y serás su propietario automáticamente. Si ya existe uno, puedes solicitar entrar.</p><div class="field"><label>Nombre del clan</label><input id="newClanName" maxlength="40" placeholder="Nadadores Unidos"></div><button class="btn primary" onclick="createRealClan()">👑 Crear clan</button><div class="field" style="margin-top:12px"><label>Buscar clan</label><input id="clanSearch" placeholder="Nombre del clan"><button class="btn secondary" style="margin-top:7px" onclick="searchClans()">🔎 Buscar</button></div><div id="clanResults"></div><button class="btn secondary" style="margin-top:10px" onclick="closeModal()">Cerrar</button>`);}}else{const ids=[...new Set(friends.map(x=>x.user_id===authUser.id?x.friend_id:x.user_id))];let profiles=[];if(ids.length){const r=await supabaseClient.from("profiles").select("id,username,public_player_id,level,rank,meters,xp").in("id",ids);profiles=r.data||[];}const incoming=requests.filter(r=>r.receiver_id===authUser.id);modal(`<div class="kicker">👥 AMIGOS</div><h2>Tu red de nadadores</h2><div class="field"><label>ID público</label><input id="friendIdInput" placeholder="SQ-ABC123"><button class="btn primary" style="margin-top:7px" onclick="sendFriendRequest()">Enviar solicitud</button></div><div class="list-item"><b>Tu ID</b><div class="sub">${esc(S.remote?.publicPlayerId||"Generando...")}</div></div>${incoming.length?`<h3 style="margin-top:12px">📩 Solicitudes recibidas</h3>${incoming.map(r=>`<div class="list-item row"><span>👤 ${esc(r.sender_id.slice(0,8))}</span><button class="btn primary" style="width:auto" onclick="acceptFriend('${r.id}','${r.sender_id}')">Aceptar</button></div>`).join("")}:""}<h3 style="margin-top:12px">🤝 Amigos</h3>${profiles.length?profiles.map(p=>`<div class="list-item"><div class="row"><b>👤 ${esc(p.username)}</b><span class="pill">${esc(p.rank)} · LV ${p.level}</span></div><div class="sub">${esc(p.public_player_id)} · ${fmt(p.meters)} m · ${fmt(p.xp)} XP</div></div>`).join(""):"<div class='sub'>Todavía no tienes amigos.</div>"}<button class="btn secondary" style="margin-top:10px" onclick="closeModal()">Cerrar</button>`);}}\n}\n'''
              s=s[:start]+new+s[end:]
          s=s.replace(marker,'')
          s=s.replace('</body>',marker+'\n</body>')
          p.write_text(s,encoding='utf-8')
          print('patched',len(s))
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix clans, password recovery, achievement coins, and add 80s style [skip swim-patch]"
          git push
