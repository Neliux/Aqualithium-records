name: Swim Quest balance update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, 'Balance: +20% monedas y -15% XP por entrenamiento') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply balance changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=s
          s=s.replace('base*(purchases.ketchup?1.10:1)*.70','base*(purchases.ketchup?1.10:1)*.85')
          s=s.replace('base*(S.purchases.ketchup?1.10:1)*.70*(S.consumables?.cloroPremium>0?1.20:1)','base*(S.purchases.ketchup?1.10:1)*.85*(S.consumables?.cloroPremium>0?1.20:1)')
          s=s.replace('trainingXP(e)*.11*trainingCoinMultiplier()','trainingXP(e)*.132*trainingCoinMultiplier()')
          s=s.replace('draftXP()*.11*trainingCoinMultiplier()','draftXP()*.132*trainingCoinMultiplier()')
          if s == old:
              raise SystemExit('No balance expressions were found; aborting.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          Path('/tmp/swim-quest.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/swim-quest.js
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/balance-update.yml
          git commit -m 'Balance: +20% monedas y -15% XP por entrenamiento'
          git push
          git rm .github/workflows/balance-update.yml
          git commit -m 'Remove temporary balance workflow'
          git push
