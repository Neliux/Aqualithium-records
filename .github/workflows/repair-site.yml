name: Repair Swim Quest site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[site-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair index structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          html_end = s.find('</html>')
          if html_end < 0:
              raise SystemExit('index.html has no closing html tag')
          tail_start = s.find('\n<style>\n.daily-roulette .roulette-wheel', html_end)
          if tail_start >= 0:
              tail = s[tail_start:]
              style_end = tail.find('</style>')
              if style_end < 0:
                  raise SystemExit('Trailing style block is incomplete')
              style = tail[:style_end + len('</style>')]
              s = s[:tail_start].rstrip() + '\n'
              head_end = s.find('</head>')
              if head_end < 0:
                  raise SystemExit('index.html has no closing head tag')
              s = s[:head_end] + style + '\n' + s[head_end:]
              p.write_text(s, encoding='utf-8')
          if '<style>' in s[s.find('</html>') + len('</html>'):]:
              raise SystemExit('CSS remains after </html>')
          print('index.html structure repaired')
          PY
      - name: Commit repaired site
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No repair was necessary.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Repair Swim Quest site structure [site-repaired]'
          git push
