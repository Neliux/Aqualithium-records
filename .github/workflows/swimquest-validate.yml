name: Swim Quest validation
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair known broken social modal and HTML structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacement=Path('repair_social_modal.txt').read_text(encoding='utf-8')
          start=s.find('async function socialModal(')
          end=s.find('async function sendFriendRequest()',start)
          if start<0 or end<0:
              raise SystemExit('socialModal boundaries not found')
          s=s[:start]+replacement+s[end:]
          m=re.search(r'</html>\s*(<style\b[^>]*>[\s\S]*?</style>)\s*$',s,re.I)
          if m:
              style=m.group(1)
              s=s[:m.start()].rstrip()+'\n</html>\n'
              head=re.search(r'</head>',s,re.I)
              if not head: raise SystemExit('missing </head>')
              s=s[:head.start()]+style+'\n'+s[head.start():]
          p.write_text(s,encoding='utf-8')
          PY
          node -e "const fs=require('fs'),s=fs.readFileSync('index.html','utf8'),m=[...s.matchAll(/<script(?![^>]*src=)[^>]*>([\\s\\S]*?)<\\/script>/gi)].map(x=>x[1]).join('\\n;');fs.writeFileSync('/tmp/combined.js',m)"
          node --check /tmp/combined.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8').lower()
          for tag in ('html','head','body'):
              assert s.count('<'+tag)==1
              assert s.count('</'+tag+'>')==1
          assert s.rstrip().endswith('</html>')
          print('HTML and JavaScript validation passed')
          PY
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: restore working social modal and index structure'
          git push
