name: Validate and repair Swim Quest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair misplaced CSS and validate HTML structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Move any style block that was accidentally appended after </html>
          # back into <head>. Preserve its exact CSS content.
          m = re.search(r'</html>\s*(<style\b[^>]*>[\s\S]*?</style>)\s*$', s, re.I)
          if m:
              style = m.group(1)
              s = s[:m.start()].rstrip() + '\n</html>\n'
              head = re.search(r'</head>', s, re.I)
              if not head:
                  raise SystemExit('index.html has no </head> tag')
              s = s[:head.start()] + style + '\n' + s[head.start():]
              p.write_text(s, encoding='utf-8')

          if s.count('<html') != 1 or s.lower().count('</html>') != 1:
              raise SystemExit('Invalid html root structure')
          if s.lower().rfind('</html>') != len(s.rstrip().lower()) - len('</html>'):
              raise SystemExit('Content exists after </html>')
          if s.lower().count('<script') != s.lower().count('</script>'):
              raise SystemExit('Unbalanced script tags')
          if s.lower().count('<style') != s.lower().count('</style>'):
              raise SystemExit('Unbalanced style tags')
          print('HTML structure OK')
          PY

      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*src=)[^>]*>([\s\S]*?)</script>', s, re.I)
          for i, code in enumerate(scripts, 1):
              f = Path(tempfile.gettempdir()) / f'swim-quest-{i}.js'
              f.write_text(code, encoding='utf-8')
              r = subprocess.run(['node','--check',str(f)], capture_output=True, text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(f'JavaScript syntax error in inline script {i}')
          print(f'JavaScript syntax OK: {len(scripts)} inline script(s)')
          PY

      - name: Commit automatic structural repair
        run: |
          if git diff --quiet -- index.html; then
            echo 'No repair needed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'fix: restore valid index.html structure'
            git push
          fi
