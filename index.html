<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07121f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/swim-quest-icon-192.png">
<title>Swim Quest</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#06111e;--bg2:#0a192b;--panel:#0d1d31;--panel2:#112943;--line:#294867;
  --text:#eef8ff;--muted:#91abc1;--a:#42ddff;--b:#765cff;
  --good:#61efaa;--warn:#ffd166;--bad:#ff6b86;
  --radius:18px;--shadow:0 15px 45px rgba(0,0,0,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 0,#15395c 0,#07131f 34%,#040a12 100%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{padding-bottom:86px;overflow-x:hidden}
body.leva::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.8) 0 1px,transparent 2px);background-size:92px 92px;animation:starsMove 14s linear infinite;opacity:.32}
@keyframes starsMove{to{background-position:0 92px,0 0}}
body.leva .card,body.leva .hero,body.leva .nav{animation:none!important}
body.leva .btn:not(.danger){animation:levRainbow 5s linear infinite!important}
body.leva .logo{animation:none!important}
body::before{
  content:"";position:fixed;inset:-18%;z-index:-2;pointer-events:none;
  background:
   radial-gradient(circle at 14% 28%,color-mix(in srgb,var(--a) 13%,transparent),transparent 22%),
   radial-gradient(circle at 84% 78%,color-mix(in srgb,var(--b) 12%,transparent),transparent 25%);
  animation:bgMove 15s ease-in-out infinite alternate;
}
@keyframes bgMove{to{transform:translate(2%,-2%) scale(1.05)}}
button,input,select,textarea{font:inherit}
button{border:0;color:var(--text);cursor:pointer}
.app{max-width:760px;margin:auto;padding:10px 12px calc(96px + env(safe-area-inset-bottom))}
.topbar{
  position:sticky;top:0;z-index:20;padding:7px 1px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:linear-gradient(180deg,rgba(6,17,30,.96),rgba(6,17,30,.78),transparent);
  backdrop-filter:blur(12px)
}
.brand{display:flex;gap:9px;align-items:center;font-weight:1000;letter-spacing:.5px}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;box-shadow:0 0 28px color-mix(in srgb,var(--a) 20%,transparent)}
.wallet{padding:9px 12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-weight:1000}
.nav{
 position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);
 z-index:50;padding:8px 8px calc(8px + env(safe-area-inset-bottom));
 display:grid;grid-template-columns:repeat(6,1fr);gap:5px;
 background:rgba(4,10,18,.94);backdrop-filter:blur(15px);border-top:1px solid rgba(60,100,138,.45)
}
.nav button{background:transparent;color:var(--muted);font-size:10px;font-weight:1000;border-radius:12px;padding:8px 3px;min-height:52px}
.nav button.active{color:#fff;background:linear-gradient(180deg,rgba(66,221,255,.16),rgba(118,92,255,.15));box-shadow:inset 0 0 0 1px rgba(66,221,255,.18)}
.card{background:linear-gradient(180deg,rgba(14,31,51,.97),rgba(8,19,32,.98));border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.hero{position:relative;overflow:hidden;padding:16px;border:1px solid #335b7e;border-radius:21px;background:linear-gradient(145deg,rgba(14,40,68,.98),rgba(8,18,31,.99))}
.hero::after{content:"";position:absolute;width:250px;height:250px;right:-105px;top:-125px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--a) 22%,transparent),transparent 66%);animation:orb 7s ease-in-out infinite alternate}
@keyframes orb{to{transform:translate(-25px,30px) scale(1.13)}}
.kicker{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;font-weight:1000;color:var(--muted)}
.sub{font-size:12px;color:var(--muted);line-height:1.45}
.big{font-size:46px;font-weight:1000;line-height:1;margin:7px 0}
h1,h2,h3,p{margin-top:0}
h1{font-size:30px}h2{font-size:21px}h3{font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.wrap{flex-wrap:wrap}
.grid{display:grid;gap:9px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.stat{padding:11px;border:1px solid #1e3852;border-radius:15px;background:#081625}.stat .v{font-size:21px;font-weight:1000;margin-top:2px}
.btn{width:100%;min-height:46px;padding:11px 13px;border-radius:13px;font-weight:1000}
.primary{background:linear-gradient(135deg,var(--a),var(--b));color:#03101b;box-shadow:0 10px 28px color-mix(in srgb,var(--a) 15%,transparent)}
.secondary{background:#10253c;border:1px solid #2d4c6c}.danger{background:#341724;border:1px solid #6a3049}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid #2b4a68;border-radius:999px;padding:5px 8px;font-size:10px;color:var(--muted)}
.progress{height:10px;border-radius:999px;background:#06111d;border:1px solid #1c3550;overflow:hidden;margin:8px 0}.progress>div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--a),var(--b));transition:width .55s}
.badge{width:88px;height:88px;border-radius:28px;display:grid;place-items:center;font-size:28px;font-weight:1000;border:2px solid rgba(255,255,255,.25);position:relative;overflow:visible;box-shadow:inset 0 0 24px rgba(255,255,255,.07),0 0 36px rgba(66,221,255,.13);animation:float 3s ease-in-out infinite}
.badge::before{content:"";position:absolute;inset:-4px;border-radius:31px;background:conic-gradient(from 0deg,transparent 0 18%,rgba(255,255,255,.7) 22%,transparent 27% 45%,rgba(255,255,255,.35) 50%,transparent 55% 100%);mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;animation:spin 5s linear infinite}
.badge::after{content:"";position:absolute;inset:-9px;border-radius:36px;border:2px dashed rgba(255,255,255,.14);animation:spin 12s linear infinite}
.badge[data-tier="mid"]{animation:float 2.4s ease-in-out infinite,glow 2.2s ease-in-out infinite}
.badge[data-tier="high"]{animation:float 1.8s ease-in-out infinite,glow 1.5s ease-in-out infinite,pulseRing 2.4s ease-in-out infinite}
.badge[data-tier="legend"]{animation:float 1.4s ease-in-out infinite,glow .95s ease-in-out infinite,pulseRing 1.8s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px) rotate(1deg)}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{50%{filter:brightness(1.18) saturate(1.25)}}@keyframes pulseRing{50%{box-shadow:inset 0 0 30px rgba(255,255,255,.12),0 0 75px rgba(66,221,255,.28)}}
.rank-card .badge::before{animation-duration:5s}
.rank-card:nth-child(n+8) .badge::after{border-style:solid;opacity:.2}
.rank-card:nth-child(n+13) .badge::before{animation-duration:2.8s}
.rank-card:nth-child(n+17) .badge::before{animation-duration:1.7s}

.bronce{background:linear-gradient(145deg,#a25b35,#512918)}.plata{background:linear-gradient(145deg,#e4edf4,#758696)}
.oro{background:linear-gradient(145deg,#ffe98d,#aa7400)}.platino{background:linear-gradient(145deg,#ecfdff,#68a9be)}
.diamante{background:linear-gradient(145deg,#83f1ff,#2d6cff)}.esmeralda{background:linear-gradient(145deg,#a5ffd7,#149d70)}
.amatista{background:linear-gradient(145deg,#e6a7ff,#6e2cb5)}.zafiro{background:linear-gradient(145deg,#85f0ff,#1b63e8);box-shadow:inset 0 0 28px rgba(255,255,255,.12),0 0 50px rgba(60,170,255,.25)}.mercurio{background:linear-gradient(145deg,#eff3f7,#626c79)}
.venus{background:linear-gradient(145deg,#ffc4a4,#a94e46)}.marte{background:linear-gradient(145deg,#ff8a68,#812c23)}
.jupiter{background:linear-gradient(145deg,#ffd0a8,#8b5038)}.saturno{background:linear-gradient(145deg,#efe0a4,#7b6b4b)}
.urano{background:linear-gradient(145deg,#a7f8ef,#418e93)}.neptuno{background:linear-gradient(145deg,#96c4ff,#283ea4)}
.tiburon{background:linear-gradient(145deg,#a9c2d2,#2b4154)}.leviatan{background:linear-gradient(145deg,#63dfd5,#184f77)}
.megalodon{background:linear-gradient(145deg,#6d94b0,#0c1f34)}.poseidon{background:linear-gradient(145deg,#7bcfff,#2849c7)}
.coach{background:linear-gradient(145deg,#fff,#ffe76d,#ff65bd,#56e5ff);box-shadow:0 0 65px rgba(255,255,255,.4)}
/* Emblemas únicos de rangos: cada rango tiene una forma visual propia, no solo un carácter. */
.rank-glyph{position:relative;width:50px;height:50px;display:grid;place-items:center;font-size:22px;font-weight:1000;color:rgba(255,255,255,.96);text-shadow:0 2px 8px rgba(0,0,0,.35)}
.rank-glyph::before,.rank-glyph::after{content:"";position:absolute;pointer-events:none}
.rank-glyph.bronce{border:4px solid rgba(255,224,196,.78);border-radius:50%;box-shadow:inset 0 0 0 5px rgba(66,28,11,.25),0 0 14px rgba(255,178,118,.2)}
.rank-glyph.bronce::before{width:18px;height:18px;border:3px solid currentColor;transform:rotate(45deg)}
.rank-glyph.plata{border:3px solid rgba(255,255,255,.82);transform:rotate(45deg);border-radius:9px}
.rank-glyph.plata::before{width:23px;height:3px;background:currentColor;transform:rotate(-45deg);border-radius:9px;box-shadow:0 8px 0 rgba(255,255,255,.4)}
.rank-glyph.oro{clip-path:polygon(8% 18%,32% 38%,50% 12%,68% 38%,92% 18%,82% 88%,18% 88%);background:linear-gradient(180deg,#fff8b7 0 25%,#ffd75a 26% 48%,#b97900 49% 100%);filter:drop-shadow(0 3px 5px rgba(0,0,0,.28));border:2px solid rgba(255,248,183,.82)}
.rank-glyph.oro::before{width:34px;height:7px;background:linear-gradient(90deg,transparent,#fff,transparent);bottom:8px;border-radius:99px;animation:goldSweep 1.9s linear infinite}@keyframes goldSweep{0%{transform:translateX(-16px);opacity:.05}45%{opacity:.9}100%{transform:translateX(16px);opacity:.05}}
.rank-glyph.platino{border:4px solid rgba(235,253,255,.88);clip-path:polygon(50% 0,92% 24%,92% 76%,50% 100%,8% 76%,8% 24%);background:rgba(107,191,218,.26)}
.rank-glyph.platino::before{width:22px;height:22px;border:3px solid currentColor;border-radius:6px;transform:rotate(45deg)}
.rank-glyph.diamante{clip-path:polygon(50% 0,100% 34%,71% 100%,29% 100%,0 34%);background:linear-gradient(145deg,#e8ffff,#2b72ff);box-shadow:inset 0 -8px 12px rgba(0,0,0,.18)}
.rank-glyph.diamante::before{width:26px;height:12px;border:2px solid rgba(255,255,255,.9);transform:skewX(-28deg) rotate(22deg);border-radius:4px}
.rank-glyph.esmeralda{border:4px solid rgba(221,255,235,.8);border-radius:55% 45% 55% 45%;transform:rotate(-35deg);background:linear-gradient(145deg,#ceffe6,#0d8d67)}
.rank-glyph.esmeralda::before{height:30px;width:2px;background:rgba(255,255,255,.78);transform:rotate(35deg)}
.rank-glyph.zafiro{border:3px solid rgba(225,250,255,.9);border-radius:50%;background:radial-gradient(circle at 35% 30%,#c9fbff 0 8%,#5bd6ff 28%,#1a55e5 78%)}
.rank-glyph.zafiro::before{width:34px;height:10px;border-top:3px solid #fff;border-radius:50%;transform:rotate(-14deg)}
.rank-glyph.amatista{background:linear-gradient(150deg,#f4c4ff,#6b2db2);clip-path:polygon(50% 0,89% 24%,76% 82%,50% 100%,24% 82%,11% 24%);}
.rank-glyph.amatista::before{width:10px;height:35px;background:rgba(255,255,255,.52);transform:rotate(25deg) skewY(-15deg);filter:blur(.3px)}
.rank-glyph.mercurio{border:3px solid rgba(255,255,255,.75);border-radius:50%;background:radial-gradient(circle at 34% 32%,#fff 0 8%,#9ea9b8 42%,#586370 100%)}
.rank-glyph.mercurio::before{width:58px;height:20px;border:2px solid rgba(255,255,255,.5);border-radius:50%;transform:rotate(-20deg)}
.rank-glyph.venus{border:3px solid rgba(255,232,211,.72);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe7d3,#ac564a)}
.rank-glyph.venus::before{width:34px;height:34px;border:2px dashed rgba(255,255,255,.55);border-radius:50%;transform:translate(8px,-6px)}
.rank-glyph.marte{border:5px solid #ffad8f;border-radius:50%;background:radial-gradient(circle at 33% 31%,#ffb07f,#7e261e);}
.rank-glyph.marte::before{width:18px;height:18px;border:3px solid rgba(255,239,229,.85);border-radius:50%}
.rank-glyph.jupiter{border-radius:50%;background:repeating-linear-gradient(0deg,#7f4737 0 7px,#c58b66 7px 12px,#f5c39e 12px 17px);border:3px solid #ffe0bd;}
.rank-glyph.jupiter::before{width:15px;height:9px;border-radius:50%;background:#f3c49c;right:5px;bottom:10px}
.rank-glyph.saturno{border-radius:50%;background:linear-gradient(180deg,#f6e7b4,#7e704d);border:3px solid #fff1c9}
.rank-glyph.saturno::before{width:66px;height:22px;border:4px solid rgba(255,240,190,.86);border-radius:50%;transform:rotate(-18deg)}
.rank-glyph.urano{border-radius:50%;background:linear-gradient(145deg,#c0fff6,#3e888f);border:3px solid #dffffa}
.rank-glyph.urano::before{width:58px;height:15px;border:3px solid rgba(255,255,255,.72);border-radius:50%;transform:rotate(55deg)}
.rank-glyph.neptuno{border-radius:50%;border:3px solid #bfe0ff;background:radial-gradient(circle at 37% 30%,#9ac6ff,#2942a7);overflow:hidden}
.rank-glyph.neptuno::before{width:72px;height:18px;border-top:4px solid rgba(255,255,255,.75);border-radius:50%;transform:rotate(-28deg);}
.rank-glyph.orca{border:3px solid #e7f9ff;border-radius:48% 52% 50% 46%;background:linear-gradient(155deg,#ffffff 0 22%,#dbeef6 23% 35%,#1f3545 36% 100%);clip-path:polygon(4% 41%,26% 35%,43% 10%,55% 7%,61% 29%,80% 31%,96% 45%,79% 56%,67% 73%,57% 96%,45% 69%,28% 63%,12% 53%)}.rank-glyph.orca::before{width:28px;height:10px;border-bottom:4px solid #fff;border-radius:0 0 60% 60%;left:13px;top:24px;transform:rotate(-8deg);box-shadow:0 0 9px rgba(255,255,255,.35)}.rank-glyph.orca::after{width:6px;height:6px;border-radius:50%;background:#fff;right:12px;top:17px;box-shadow:0 0 8px #fff}.rank-glyph.kraken{border:3px solid #b3fff9;border-radius:45%;background:radial-gradient(circle at 50% 38%,#d7fff8 0 7%,#76d8c8 8% 25%,#2c777e 26% 52%,#10293f 53% 100%);box-shadow:inset 0 0 18px rgba(120,255,242,.24),0 0 30px rgba(39,220,221,.22);clip-path:polygon(50% 2%,62% 14%,76% 12%,72% 28%,90% 36%,79% 48%,94% 64%,76% 68%,83% 92%,64% 76%,56% 98%,48% 78%,38% 96%,35% 75%,14% 84%,24% 63%,6% 52%,23% 41%,10% 24%,30% 27%,29% 9%,43% 16%)}.rank-glyph.kraken::before{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#071827 0 13%,#ffffff 14% 28%,#54e8d9 29% 100%);left:12px;top:12px;box-shadow:20px 0 0 -2px #7dfff3,10px 24px 0 -5px #bffefa,-10px 22px 0 -5px #bffefa}.rank-glyph.kraken::after{width:10px;height:32px;border-radius:50%;background:linear-gradient(180deg,transparent,#9effef);right:8px;bottom:2px;transform:rotate(18deg);box-shadow:-17px 14px 0 -3px rgba(148,255,241,.8),17px 11px 0 -3px rgba(148,255,241,.75),-30px 3px 0 -4px rgba(148,255,241,.65),28px 0 0 -4px rgba(148,255,241,.65)}.rank-glyph.tiburon{border:3px solid #d7edf8;border-radius:54% 44% 48% 42%;background:linear-gradient(150deg,#d9edf5 0 28%,#6e93a8 29% 47%,#183244 48% 100%);clip-path:polygon(3% 44%,24% 30%,45% 25%,52% 2%,60% 27%,78% 31%,99% 43%,83% 51%,70% 58%,58% 92%,51% 62%,40% 72%,27% 58%,12% 57%)}.rank-glyph.tiburon::before{width:28px;height:11px;border-bottom:4px solid #fff;border-radius:0 0 70% 70%;left:13px;top:24px;transform:rotate(-8deg);box-shadow:0 0 10px rgba(255,255,255,.28)}.rank-glyph.tiburon::after{width:6px;height:6px;border-radius:50%;background:#fff;right:10px;top:16px;box-shadow:0 0 10px #fff,-17px 22px 0 -1px rgba(255,255,255,.35),12px 27px 0 -2px rgba(255,255,255,.26)}
.rank-glyph.leviatan{border:3px solid #91fff4;border-radius:48% 42% 52% 40%;background:radial-gradient(circle at 32% 30%,#a8fff0 0 8%,#47b7aa 9% 31%,#14516a 32% 67%,#061827 68%);clip-path:polygon(0 48%,16% 36%,29% 42%,38% 28%,47% 41%,56% 17%,65% 37%,74% 24%,83% 42%,100% 49%,84% 58%,73% 57%,64% 77%,54% 61%,44% 87%,35% 62%,24% 72%,15% 58%);box-shadow:inset 0 0 20px rgba(105,255,232,.22),0 0 30px rgba(68,224,211,.22)}.rank-glyph.leviatan::before{width:34px;height:9px;border-bottom:4px solid rgba(239,255,253,.9);border-radius:0 0 80% 80%;left:10px;top:27px;transform:rotate(8deg);box-shadow:0 0 10px rgba(146,255,241,.4)}.rank-glyph.leviatan::after{width:7px;height:7px;border-radius:50%;background:#eaffff;right:11px;top:16px;box-shadow:0 0 12px #8ffcff,-24px 24px 0 -1px rgba(255,255,255,.55),-8px 31px 0 -2px rgba(255,255,255,.28)}
.rank-glyph.megalodon{border:3px solid #e1eff7;border-radius:46%;background:linear-gradient(180deg,#c7dce6 0 18%,#627f91 19% 40%,#2a3f50 41% 62%,#071827 63% 100%);clip-path:polygon(10% 18%,32% 18%,42% 6%,51% 20%,60% 5%,70% 20%,91% 25%,79% 42%,75% 55%,96% 70%,75% 68%,65% 96%,53% 71%,41% 96%,31% 69%,9% 74%,23% 55%,19% 39%,4% 30%);box-shadow:inset 0 0 18px rgba(255,255,255,.12),0 0 30px rgba(151,205,232,.2)}.rank-glyph.megalodon::before{width:34px;height:25px;border:4px solid #f4fbff;border-top:0;border-radius:0 0 55% 55%;left:12px;top:24px;box-shadow:inset 0 -5px 0 rgba(255,255,255,.18),0 0 10px rgba(255,255,255,.28)}.rank-glyph.megalodon::after{width:6px;height:6px;border-radius:50%;background:#fff;right:10px;top:15px;box-shadow:0 0 11px #fff,-20px 35px 0 -1px rgba(255,255,255,.42),10px 34px 0 -2px rgba(255,255,255,.25)}
.rank-glyph.poseidon{border:3px solid #bfe8ff;border-radius:48% 48% 42% 42%;background:radial-gradient(circle at 42% 33%,#b8efff,#4d90ee 42%,#26358e 100%);clip-path:polygon(50% 0,60% 18%,73% 14%,70% 32%,92% 42%,72% 51%,82% 85%,59% 67%,50% 100%,41% 67%,18% 85%,28% 51%,8% 42%,30% 32%,27% 14%,40% 18%)}
.rank-glyph.poseidon::before{width:26px;height:5px;background:#fff;border-radius:99px;top:22px;box-shadow:0 0 12px #fff}
.rank-glyph.poseidon::after{width:34px;height:34px;border:2px solid rgba(255,255,255,.72);border-radius:50%;top:9px;box-shadow:0 0 20px rgba(111,224,255,.5)}
.rank-glyph.coach{border:3px solid #fff;border-radius:16px;background:conic-gradient(#fff7a8,#ff7dc3,#6deeff,#fff7a8);color:#091827;box-shadow:0 0 22px rgba(255,255,255,.42)}
.rank-glyph.coach::before{width:34px;height:10px;background:#fff;border-radius:4px 4px 10px 10px;top:11px;box-shadow:0 -5px 0 0 #ffe76d}
.rank-glyph.coach::after{width:42px;height:4px;background:#fff;bottom:10px;border-radius:99px}
.rank-small .rank-glyph{transform:scale(.78)}
.rank-card .badge{display:grid;place-items:center}


/* Progresión visual: cuanto más alto el rango, más capas, brillo y movimiento tiene el emblema. */
.badge[data-tier="low"] .rank-glyph{filter:drop-shadow(0 3px 5px rgba(0,0,0,.26))}
.badge[data-tier="mid"] .rank-glyph{filter:drop-shadow(0 4px 8px rgba(44,170,255,.22))}
.badge[data-tier="high"] .rank-glyph{filter:drop-shadow(0 5px 12px rgba(89,209,255,.28))}
.badge[data-tier="legend"] .rank-glyph{filter:drop-shadow(0 6px 17px rgba(255,255,255,.32))}
.badge[data-tier="mid"]::after{inset:-11px;border-style:solid;border-width:2px;box-shadow:0 0 0 4px rgba(66,221,255,.05),0 0 25px rgba(66,221,255,.12)}
.badge[data-tier="high"]::after{inset:-13px;border-width:2px;box-shadow:0 0 0 5px rgba(118,92,255,.06),0 0 32px rgba(66,221,255,.18)}
.badge[data-tier="legend"]::after{inset:-15px;border-width:3px;border-style:solid;box-shadow:0 0 0 6px rgba(255,255,255,.06),0 0 50px rgba(118,92,255,.25)}
.badge[data-tier="legend"]::before{inset:-7px;animation-duration:1.15s}
.rank-glyph.bronce{box-shadow:inset 0 0 0 5px rgba(66,28,11,.25),inset 0 0 15px rgba(255,214,173,.18),0 0 20px rgba(255,178,118,.34)}
.rank-glyph.plata{box-shadow:inset 0 0 14px rgba(255,255,255,.25),0 0 14px rgba(255,255,255,.24)}
.rank-glyph.bronce::after{width:7px;height:7px;border-radius:50%;background:#fff1db;top:6px;right:8px;box-shadow:0 0 10px rgba(255,220,180,.7),-22px 25px 0 -2px rgba(255,255,255,.35)}
.rank-glyph.plata::after{width:7px;height:7px;border-radius:50%;background:#fff;top:5px;left:6px;box-shadow:25px 23px 0 -2px rgba(255,255,255,.4)}

const DIFFICULTY_STYLE_WEIGHT={crol:1.00,espalda:1.10,pecho:1.22,mariposa:1.40,combinado:1.28,otro:1.00};
const DIFFICULTY_INTENSITY_WEIGHT={suave:1.00,normal:1.10,intenso:1.35,cansado:1.60};
function difficultySeriesPoints(s){
 const distance=Math.max(0,Number(s?.distance)||0),reps=Math.max(0,Number(s?.reps)||0);
 if(!distance||!reps)return 0;
 const meters=distance*reps;
 const styleWeight=DIFFICULTY_STYLE_WEIGHT[s.style]||1;
 const intensityWeight=DIFFICULTY_INTENSITY_WEIGHT[s.intensity]||1;
 let butterflyBonus=1;
 if(s.style==="mariposa"&&distance>=100&&reps>1){
  butterflyBonus=Math.min(1.65,1.35+(reps-2)*.08);
 }
 return meters*styleWeight*intensityWeight*butterflyBonus;
}
function difficultyInfo(e, avgMetersOverride=null){
 const series=Array.isArray(e?.series)?e.series:[];
 const meters=series.reduce((a,s)=>a+(Number(s.distance)||0)*(Number(s.reps)||0),0);
 if(meters<=0)return DIFFICULTIES[0];
 const base=Math.max(100,Number(avgMetersOverride)||1000);
 const difficultyPoints=series.reduce((a,s)=>a+difficultySeriesPoints(s),0);
 const xp=Number.isFinite(Number(e?.xp))?Number(e.xp):trainingXP({...e,series});
 const xpPerMeter=meters?xp/meters:1;
 const xpFactor=Math.max(.90,Math.min(1.15,xpPerMeter/1.05));
 const effectiveRatio=(difficultyPoints/base)*(.92+.08*xpFactor);
 if(meters>=6000)return {...DIFFICULTIES[5],points:Math.round(difficultyPoints)};
 let idx=effectiveRatio<1.20?0:effectiveRatio<1.80?1:effectiveRatio<2.50?2:effectiveRatio<3.40?3:4;
 if(idx>=4 && meters<2000)idx=3;
 return {...DIFFICULTIES[idx],points:Math.round(difficultyPoints)};
}
function difficultyForKey(key){return DIFFICULTIES.find(d=>d.key===key)||DIFFICULTIES[0]}
function difficultyLabel(e){const d=typeof e==="string"?difficultyForKey(e):difficultyInfo(e,S?.profile?.avgMeters);return `${d.icon} ${d.name}`}
function difficultyCounts(arr){return Object.fromEntries(DIFFICULTIES.map(d=>[d.key,arr.filter(e=>difficultyInfo(e,S?.profile?.avgMeters).key===d.key).length]))}

function weekKey(d=new Date()){const x=new Date(d);const day=x.getDay();x.setDate(x.getDate()+(day===0?-6:1-day));return x.toISOString().slice(0,10)}

function ambientStart(){

function pickSmartMissions(pool,count,seed,existing){
 const h=missionHistory(),used=new Set(existing.map(m=>m.type+":"+(m.style||m.suffix))),picked=[];let cursor=seed%pool.length;
 const score=m=>{
  let s=1;
  if(m.style===h.favoriteStyle)s-=0.35;
  if(m.style&&!(h.styleTotals[m.style]>0))s+=0.45;
  if(m.type==="difficultySessions"&&!h.recent.some(e=>difficultyInfo(e,h.base).key===m.difficulty))s+=0.15;
  if(m.type==="correctives"&&!h.recent.some(e=>e.series.some(x=>x.corrective)))s+=0.25;
  if((m.target||0)>Math.max(2,weekTrain().length+2)&&m.type.includes("Sessions"))s-=0.2;
  if(m.type==="bigSession"&&(m.target||0)>Math.max(2500,h.avgRecent*1.65))s-=0.25;
  return s;
 };
 const candidates=pool.map(m=>({m,s:score(m)})).sort((a,b)=>b.s-a.s);
 while(picked.length<count&&candidates.length){
  const available=candidates.filter(x=>!used.has(x.m.type+":"+(x.m.style||x.m.suffix)));
  if(!available.length)break;
  const window=Math.min(7,available.length),index=(cursor++%window);const chosen=available[index].m;used.add(chosen.type+":"+(chosen.style||chosen.suffix));picked.push(chosen);
 }
 return picked;
}

 return 0;

function achievementUnlocked(a){return !!(S.achievements||[]).includes(a.id)}
function achievementCheck(){
 if(!S.profile)return [];
 if(!Array.isArray(S.achievements))S.achievements=[];
 const unlocked=[];
 for(const a of ACHIEVEMENTS){
  if(a.secret)continue;
  if(!achievementUnlocked(a)&&a.ok()){
   S.achievements.push(a.id);unlocked.push(a);
   if(a.reward?.theme)S.purchases["theme_"+a.reward.theme]=true;
   if(a.reward?.coins)S.coins+=Number(a.reward.coins||0);
   if(a.reward?.xp){S.xp+=Number(a.reward.xp||0);S.level=levelFromXP(S.xp);}
  }
 }
 if(unlocked.length){save();if(authUser)syncProfileToCloud()}
 return unlocked;
}

function trainingTimer(){
 const draw=()=>{const sec=Math.floor(timerElapsed/1000),mm=String(Math.floor(sec/60)).padStart(2,"0"),ss=String(sec%60).padStart(2,"0"),ms=String(Math.floor((timerElapsed%1000)/10)).padStart(2,"0");const el=$("timerValue");if(el)el.textContent=`${mm}:${ss}.${ms}`;};
 modal(`<div class="kicker">⏱️ CRONÓMETRO DE ENTRENAMIENTO</div><h2 style="text-align:center">Mide tu serie o descanso</h2><div id="timerValue" style="font-size:54px;font-weight:1000;text-align:center;margin:20px 0">00:00.00</div><div class="grid g2"><button class="btn primary" onclick="timerToggle()">▶ / ⏸</button><button class="btn secondary" onclick="timerReset()">↺ Reiniciar</button></div><button class="btn secondary" style="margin-top:10px" onclick="timerClose()">Cerrar</button>`);
 draw();
}
function timerToggle(){
 if(timerInterval){clearInterval(timerInterval);timerInterval=null;return}
 timerStartedAt=performance.now()-timerElapsed;
 timerInterval=setInterval(()=>{timerElapsed=performance.now()-timerStartedAt;const el=$("timerValue");if(el){const sec=Math.floor(timerElapsed/1000),mm=String(Math.floor(sec/60)).padStart(2,"0"),ss=String(sec%60).padStart(2,"0"),ms=String(Math.floor((timerElapsed%1000)/10)).padStart(2,"0");el.textContent=`${mm}:${ss}.${ms}`}},30);
}
function timerReset(){clearInterval(timerInterval);timerInterval=null;timerElapsed=0;const el=$("timerValue");if(el)el.textContent="00:00.00";}
function timerClose(){timerReset();closeModal();}

function commitEdit(id){
 const e=S.trainings.find(x=>x.id===id);if(!e)return;const oldRank=currentRank().r.c;
 const arr=Array.from(document.querySelectorAll("#editSeries .series")).map((row,i)=>{
  const g=row.querySelectorAll(".ed"),s={distance:+g[0].value||0,reps:+g[1].value||1,style:g[2].value,intensity:g[3].value,time:+g[4].value||0,corrective:row.querySelector(".edcorr").checked};return s;
 }).filter(s=>s.distance>0);
 const newDate=$("edDate").value;
 if(countTrainingsOnDate(newDate,id)>=3){showDailyLimitModal();return}
 if(arr.reduce((a,s)=>a+(+s.distance||0)*(+s.reps||0),0)>70000){showImpossibleDistanceModal();return}
 if(suspiciousRecordSeries(arr)){showRecordSanityModal();return}
 e.date=newDate;e.name=(document.getElementById("edName")?.value||"").trim();e.durationMin=+(document.getElementById("edDur")?.value||0);e.series=arr;e.difficulty=difficultyInfo(e,S?.profile?.avgMeters).key;rebuildProfile();
 const newRecords=updatePersonalRecords(e);save();
 closeModal();render();toast("✏️ Cambios guardados.");
 if(newRecords.length)showRecordNotices(newRecords);
 if(currentRank().r.c!==oldRank)rankReveal(currentRank().r);
}
function rebuildProfile(){
 let tx=0,tc=0;S.trainings.forEach(e=>{e.difficulty=difficultyInfo(e,S?.profile?.avgMeters).key;e.xp=trainingXP(e);e.coins=trainingCoins(e);tx+=e.xp;tc+=e.coins});
 let mx=0,mc=0;[...(S.missions.week||[]),...(S.missions.month||[])].forEach(m=>{if(S.claimed.includes(m.id)){mx+=m.xp;mc+=Math.round(m.coins*coinMultiplier())}});
 S.xp=tx+mx;S.coins=tc+mc+(S.bonusCoins||0)+(S.levelRewardCoins||0);S.level=levelFromXP(S.xp);save();
}
function deleteTraining(id){if(!confirm("¿Eliminar este entrenamiento?"))return;S.trainings=S.trainings.filter(x=>x.id!==id);rebuildProfile();render();toast("🗑️ Entrenamiento eliminado.");}

function statsFilteredTrainings(){
 const q=String(statsQuery||"").trim().toLowerCase();
 const arr=S.trainings.slice().sort((a,b)=>(b.number||0)-(a.number||0));
 if(!q)return arr;
 const numQ=q.replace(/^#/,'');
 return arr.filter(e=>String(e.number||"")===numQ || String(e.name||"").toLowerCase().includes(q));
}
function updateStatsSearch(){

function chart(labels,vals,key="m"){
 if(!vals.length)return `<div class="empty">Registra prácticas para ver el gráfico.</div>`;
 const max=Math.max(...vals,1);
 return `<div class="meter-chart">${vals.map((v,i)=>{const h=Math.max(6,v/max*150);return `<div class="meter-col"><div class="meter-value">${fmt(v)} m</div><div class="meter-track"><div class="meter-fill" style="height:${h}px"></div></div><div class="meter-label">${esc(labels[i]||"")}</div></div>`}).join("")}</div>`;
}
function difficultyDonut(arr){
 const counts=difficultyCounts(arr),entries=Object.entries(counts).filter(([,v])=>v>0);
 if(!entries.length)return `<div class="empty">Registra entrenamientos para ver qué dificultad haces más.</div>`;
 const total=entries.reduce((a,[,v])=>a+v,0);
 const palette={facil:"#61efaa",normal:"#42ddff",intenso:"#ffd166",discreo:"#ff9a66",demoniaco:"#ff6b86",masoquista:"#2b2b33"};
 let angle=0;const stops=[];
 entries.forEach(([k,v])=>{const start=angle;angle+=v/total*360;stops.push(`${palette[k]} ${start.toFixed(2)}deg ${angle.toFixed(2)}deg`)});
 return `<div class="difficulty-donut-wrap"><div class="difficulty-donut" style="background:conic-gradient(${stops.join(",")})"><div class="difficulty-donut-hole"><b>${fmt(total)}</b><span>sesiones</span></div></div><div class="difficulty-donut-legend">${entries.sort((a,b)=>b[1]-a[1]).map(([k,v])=>{const d=difficultyForKey(k);return `<div class="difficulty-legend-row"><span><i style="background:${palette[k]};color:${palette[k]}"></i>${d.icon} ${d.name}</span><b>${fmt(v)}</b></div>`}).join("")}</div></div>`;
}
function spawnTideTrail(){
 const host=$("themeParticles");if(!host)return;
 for(let i=0;i<32;i++){const el=document.createElement("span");el.className="theme-particle tide";el.style.left=(8+Math.random()*84)+"%";el.style.top=(54+Math.random()*29)+"%";el.style.setProperty("--dx",((Math.random()-.5)*140)+"px");el.style.animationDelay=(Math.random()*.45)+"s";el.style.animationDuration=(1.9+Math.random()*1.5)+"s";host.appendChild(el);setTimeout(()=>el.remove(),4200);}
}
function bars(o){

 return `<div class="list">${Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div><div class="row"><span>${STYLE[k]?.icon||""} ${STYLE[k]?.name||k}</span><b>${fmt(v)} m</b></div><div class="progress"><div style="width:${Math.max(2,v/max*100)}%"></div></div></div>`).join("")}</div>`;
}

async function signUpReal(){
 if(!supabaseReady()){toast("Supabase todavía no está disponible.");return}
 const username=$("authUserName")?.value.trim(),email=$("authEmail")?.value.trim(),password=$("authPassword")?.value||"";
 if(!username||!email||password.length<6){toast("Completa nombre, correo y una contraseña de al menos 6 caracteres.");return}
 if(authBusy)return;authBusy=true;
 try{
  const {data,error}=await supabaseClient.auth.signUp({email,password});
  if(error)throw error;
  if(data.user&&data.session){
   authUser=data.user;
   const row={id:data.user.id,username,public_player_id:publicPlayerId(),level:S.level,xp:S.xp,coins:S.coins,meters:totalMeters(),rank:currentRank().r.n};
   const ins=await supabaseClient.from("profiles").upsert(row,{onConflict:"id"}).select().single();
   if(ins.error)throw ins.error;
   S.remote={userId:data.user.id,publicPlayerId:ins.data.public_player_id,username};S.profile=S.profile||{name:username,gender:"Prefiero no decirlo",bio:"",avgMeters:1000,records:{crol:"",espalda:"",pecho:"",mariposa:""},created:Date.now()};S.profile.name=username;save();closeModal();render();toast("✅ Cuenta creada y vinculada a Swim Quest.");
  }else{toast("📩 Cuenta creada. Revisa tu correo para confirmar la cuenta y luego inicia sesión.",5000)}
 }catch(e){toast("❌ "+(e?.message||"No se pudo crear la cuenta."),4200)}finally{authBusy=false}
}
